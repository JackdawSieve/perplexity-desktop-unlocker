<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="35%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>
  <rect width="1200" height="360" fill="url(#glow3)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Decorative circles -->
  <g fill="none" stroke-width="1" opacity="0.08">
    <circle cx="100" cy="80" r="60" stroke="#60a5fa"/>
    <circle cx="1100" cy="90" r="45" stroke="#a78bfa"/>
    <circle cx="950" cy="300" r="70" stroke="#22d3ee"/>
    <circle cx="180" cy="290" r="35" stroke="#60a5fa"/>
  </g>

  <!-- Thin accent lines -->
  <g opacity="0.12">
    <line x1="60" y1="55" x2="380" y2="55" stroke="#60a5fa" stroke-width="1"/>
    <line x1="820" y1="55" x2="1140" y2="55" stroke="#60a5fa" stroke-width="1"/>
    <line x1="60" y1="310" x2="420" y2="310" stroke="#a78bfa" stroke-width="1"/>
    <line x1="780" y1="310" x2="1140" y2="310" stroke="#a78bfa" stroke-width="1"/>
  </g>

  <!-- Small decorative dots -->
  <g fill="#60a5fa" opacity="0.15">
    <circle cx="530" cy="70" r="2"/>
    <circle cx="670" cy="65" r="2"/>
    <circle cx="600" cy="295" r="2"/>
    <circle cx="580" cy="310" r="1.5"/>
    <circle cx="620" cy="310" r="1.5"/>
  </g>

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Perplexity Pro 2026</tspan>
    <tspan x="600" dy="62">Desktop Unlocked</tspan>
  </text>

  <!-- Subtle line under headline -->
  <line x1="420" y1="245" x2="780" y2="245" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>

  <!-- Tagline -->
  <text x="600" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Desktop companion for Perplexity Pro users — organize 2026</tspan>
    <tspan x="600" dy="28">research sessions, save threads, and surface cited</tspan>
  </text>

  <!-- Bottom accent glow line -->
  <line x1="200" y1="330" x2="1000" y2="330" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
</svg>